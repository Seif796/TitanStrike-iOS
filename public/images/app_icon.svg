<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="cyberGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E2A4A"/>
      <stop offset="60%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#05070B"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#0072FF"/>
      <stop offset="100%" stop-color="#7000FF"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="115" fill="url(#cyberGlow)"/>
  
  <!-- Cyber Hex Grid lines -->
  <path d="M 256,40 L 440,140 L 440,360 L 256,470 L 72,360 L 72,140 Z" fill="none" stroke="#00F0FF" stroke-width="4" stroke-opacity="0.3"/>
  <path d="M 256,70 L 410,155 L 410,345 L 256,440 L 102,345 L 102,155 Z" fill="none" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.15"/>

  <!-- Fortress Defensive Wall silhouette in background -->
  <path d="M 120,380 L 160,320 L 200,320 L 210,340 L 302,340 L 312,320 L 352,320 L 392,380 Z" fill="#131D2E" stroke="#00F0FF" stroke-width="3" stroke-opacity="0.5"/>
  <rect x="236" y="320" width="40" height="40" rx="4" fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Cyber Titan Boss Horns / Silhouette in Background -->
  <path d="M 160,190 L 130,90 L 200,140 Z" fill="url(#fireGrad)" opacity="0.8"/>
  <path d="M 352,190 L 382,90 L 312,140 Z" fill="url(#fireGrad)" opacity="0.8"/>
  <!-- Boss Menacing Glowing Eyes -->
  <polygon points="190,165 235,175 200,185" fill="#FF0055" filter="url(#glow)"/>
  <polygon points="322,165 277,175 312,185" fill="#FF0055" filter="url(#glow)"/>

  <!-- Hero Futuristic Cyber Helmet / Character Silhouette in Foreground -->
  <path d="M 256,170 C 210,170 190,205 190,260 C 190,320 220,365 256,375 C 292,365 322,320 322,260 C 322,205 302,170 256,170 Z" fill="#1A2338" stroke="#00F0FF" stroke-width="5"/>
  
  <!-- Glowing Neon Cyber Visor -->
  <path d="M 205,245 C 230,235 282,235 307,245 C 312,260 300,278 256,280 C 212,278 200,260 205,245 Z" fill="url(#shieldGrad)" filter="url(#glow)"/>
  
  <!-- Crosshair / Aim Tech Ring -->
  <circle cx="256" cy="260" r="110" fill="none" stroke="#00F0FF" stroke-width="3" stroke-dasharray="14 18" stroke-opacity="0.6"/>
  <circle cx="256" cy="260" r="125" fill="none" stroke="#FF0055" stroke-width="2" stroke-dasharray="40 60" stroke-opacity="0.5"/>
  
  <!-- Build Tool / Hammer & Laser Rifle Icons overlay at bottom -->
  <g transform="translate(180, 395) scale(0.65)">
    <!-- Pickaxe / Build tool -->
    <path d="M 40,80 L 140,-20 L 160,0 L 60,100 Z" fill="#00F0FF"/>
    <path d="M 120,-30 L 180,-10 L 190,10 L 170,-10 Z" fill="#FFFFFF"/>
  </g>
  <g transform="translate(260, 395) scale(0.65)">
    <!-- Blaster -->
    <path d="M 0,20 L 70,20 L 70,40 L 40,50 L 30,80 L 10,80 L 20,40 L 0,40 Z" fill="#FF3366"/>
  </g>

  <!-- Title Badge Text -->
  <rect x="96" y="445" width="320" height="42" rx="10" fill="#0A0E17" stroke="#00F0FF" stroke-width="2"/>
  <text x="256" y="473" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="3">CYBERFORT 3D</text>
</svg>
