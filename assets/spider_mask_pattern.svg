<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="spiderRed" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#E8242A"/>
      <stop offset="70%" stop-color="#C81820"/>
      <stop offset="100%" stop-color="#9C1016"/>
    </radialGradient>
  </defs>

  <!-- Mask Base Red Fabric -->
  <rect width="512" height="512" fill="url(#spiderRed)"/>

  <!-- Radial Web Lines from Center Forehead/Nose Bridge -->
  <g stroke="#18181A" stroke-width="4.5" stroke-linecap="round" opacity="0.9">
    <!-- Vertical and near vertical -->
    <line x1="256" y1="260" x2="256" y2="0"/>
    <line x1="256" y1="260" x2="256" y2="512"/>
    <line x1="256" y1="260" x2="190" y2="0"/>
    <line x1="256" y1="260" x2="322" y2="0"/>
    <line x1="256" y1="260" x2="120" y2="0"/>
    <line x1="256" y1="260" x2="392" y2="0"/>
    <line x1="256" y1="260" x2="50" y2="20"/>
    <line x1="256" y1="260" x2="462" y2="20"/>

    <!-- Diagonal and Horizontal -->
    <line x1="256" y1="260" x2="0" y2="100"/>
    <line x1="256" y1="260" x2="512" y2="100"/>
    <line x1="256" y1="260" x2="0" y2="190"/>
    <line x1="256" y1="260" x2="512" y2="190"/>
    <line x1="256" y1="260" x2="0" y2="280"/>
    <line x1="256" y1="260" x2="512" y2="280"/>
    <line x1="256" y1="260" x2="0" y2="380"/>
    <line x1="256" y1="260" x2="512" y2="380"/>
    <line x1="256" y1="260" x2="0" y2="470"/>
    <line x1="256" y1="260" x2="512" y2="470"/>

    <!-- Lower diagonals -->
    <line x1="256" y1="260" x2="80" y2="512"/>
    <line x1="256" y1="260" x2="432" y2="512"/>
    <line x1="256" y1="260" x2="170" y2="512"/>
    <line x1="256" y1="260" x2="342" y2="512"/>
  </g>

  <!-- Concentric Web Loop Arcs -->
  <g fill="none" stroke="#18181A" stroke-width="4" opacity="0.88">
    <!-- Ring 1 (Inner) -->
    <path d="M 230,225 Q 256,238 282,225 Q 296,250 282,275 Q 256,265 230,275 Q 216,250 230,225 Z"/>
    <!-- Ring 2 -->
    <path d="M 205,190 Q 256,212 307,190 Q 332,240 307,295 Q 256,275 205,295 Q 180,240 205,190 Z"/>
    <!-- Ring 3 -->
    <path d="M 175,150 Q 256,182 337,150 Q 375,230 337,325 Q 256,290 175,325 Q 137,230 175,150 Z"/>
    <!-- Ring 4 -->
    <path d="M 140,105 Q 256,145 372,105 Q 425,220 372,365 Q 256,310 140,365 Q 87,220 140,105 Z"/>
    <!-- Ring 5 -->
    <path d="M 100,55 Q 256,105 412,55 Q 478,210 412,415 Q 256,335 100,415 Q 34,210 100,55 Z"/>
    <!-- Ring 6 (Outer) -->
    <path d="M 50,5 Q 256,65 462,5 Q 515,200 462,475 Q 256,365 50,475 Q 0,200 50,5 Z"/>
  </g>
</svg>
