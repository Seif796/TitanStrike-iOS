name: Build iOS IPA

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Godot 4.3 & Export Templates
        run: |
          echo "=== Downloading Godot 4.3 ==="
          GODOT_VERSION="4.3-stable"
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q godot.zip
          mv "Godot.app" /Applications/Godot.app
          
          # Link godot executable to PATH
          sudo ln -s /Applications/Godot.app/Contents/MacOS/Godot /usr/local/bin/godot
          godot --version
          
          echo "=== Downloading Export Templates ==="
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q templates.tpz
          
          # Install templates to Godot directory on macOS
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATES_DIR"
          mv templates/* "$TEMPLATES_DIR/"
          echo "Templates installed to $TEMPLATES_DIR"

      - name: Export Godot Project to iOS Xcode Project
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/TitanStrike.xcodeproj
          
          echo "=== Export folder contents ==="
          ls -la build/ios

      - name: Force iOS Landscape Orientation in Info.plist
        run: |
          echo "=== Configuring Info.plist for Landscape ONLY ==="
          PLIST_FILES=$(find build/ios -name "*-Info.plist" -o -name "Info.plist")
          for plist in $PLIST_FILES; do
            echo "Patching: $plist"
            /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$plist" || true
            /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$plist"
            /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$plist"
            /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$plist"
            
            /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$plist" || true
            /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$plist"
            /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" "$plist"
            /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" "$plist"
          done

      - name: Build Xcode Project to App
        run: |
          cd build/ios
          
          # Find the xcodeproj file
          XCODEPROJ=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          echo "Found Xcode project: $XCODEPROJ"
          if [ -z "$XCODEPROJ" ]; then
            echo "Error: No xcodeproj found in build/ios"
            exit 1
          fi
          
          # Get available scheme
          SCHEME=$(xcodebuild -list -project "$XCODEPROJ" | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag{gsub(/^[ \t]+/, ""); print; exit}')
          if [ -z "$SCHEME" ]; then
            SCHEME="$(basename "$XCODEPROJ" .xcodeproj)"
          fi
          echo "Using scheme: $SCHEME"
          
          # Build unsigned app for iphoneos
          xcodebuild build \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath ./DerivedData
            
          echo "Xcode build finished successfully."

      - name: Package App into IPA
        run: |
          cd build/ios
          APP_PATH=$(find ./DerivedData -name "*.app" -type d | head -n 1)
          echo "Found App at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app found in DerivedData"
            exit 1
          fi
          
          mkdir -p ipa_package/Payload
          cp -R "$APP_PATH" ipa_package/Payload/
          
          cd ipa_package
          zip -qr ../TitanStrike-unsigned.ipa Payload
          cd ..
          
          echo "Successfully created TitanStrike-unsigned.ipa"
          ls -lh TitanStrike-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TitanStrike-iOS-IPA
          path: build/ios/TitanStrike-unsigned.ipa
          retention-days: 14

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ios/TitanStrike-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
